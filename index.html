<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mbarara University of Science Application System | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page-container">

        <section class="welcome-panel">
            <div class="brand">
                <img src ="MUST.jpg"
                alt ="MUST university Logo"
                class="brand-logo">
                <div>
                    <h2>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h2>
                    <p>Student Application System</p>
                </div>
            </div>
        </section>

        <section class="form-panel">
            <div class="form-content">
                <p class="eyebrow">STUDENT PORTAL</p>
                <h1>Login to your account</h1>
                <p class="subtitle">
                    Enter your details to continue.
                </p>

                <form>
                    <div class="form-group">
                        <label for="student">Student Number or Email</label>
                        <input
                            type="text"
                            id="student"
                            name="student"
                            placeholder="Enter student number or email"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>

                        <a href="mailto:support@must.ac.ug">
                            Need help?
                        </a>
                    </div>

                    <button type="submit" class="btn-primary">
                        Login to Account
                    </button>
                </form>

                <div class="separator">
                    <span>NEW TO THE PORTAL?</span>
                </div>

                <a href="Register.html" class="btn-secondary">
                    Create an Account
                </a>
            </div>
        </section>

    </main>
</body>
</html>
